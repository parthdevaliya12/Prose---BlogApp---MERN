<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;600;700&display=swap"
    rel="stylesheet" />
  <title>Prose - AI Powered Blogging</title>

  <!-- SEO Meta Tags -->
  <meta name="description"
    content="Prose - A modern platform to build, publish, and grow your blog with powerful features and built-in SEO." />
  <meta name="keywords" content="blog, platform, writing, publish, articles, tech, content creation" />
  <meta name="author" content="Parth Devaliya" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://prose.com/" />
  <meta property="og:title" content="Prose - Read, explore, and learn" />
  <meta property="og:description"
    content="Discover articles from our network of writers. Dive deep into topics you care about, from technology and design to health and business." />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://prose.com/" />
  <meta property="twitter:title" content="Prose - Read, explore, and learn" />
  <meta property="twitter:description"
    content="Discover articles from our network of writers. Dive deep into topics you care about, from technology and design to health and business." />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script type="text/javascript">
    (function (l) {
      if (l.search[1] === "/") {
        var decoded = l.search
          .slice(1)
          .split("&")
          .map(function (s) {
            return s.replace(/~and~/g, "&");
          })
          .join("?");
        window.history.replaceState(
          null,
          null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    })(window.location);
  </script>
</body>

</html>
